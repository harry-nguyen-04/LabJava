server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: orders
  
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/order-db}
    username: ${DATABASE_USERNAME:order_user}
    password: ${DATABASE_PASSWORD:order_password}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}

logging:
  pattern:
    level: "%5p [correlationId=%X{correlationId}]"

pricing:
  base-url: ${PRICING_BASE_URL:http://localhost:8081}
  timeout-ms: ${PRICING_TIMEOUT_MS:1000}

resilience4j:
  circuitbreaker:
    instances:
      externalService:
        registerHealthIndicator: true
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
  retry:
    instances:
      externalService:
        maxAttempts: 3
        waitDuration: 100ms

management:
  endpoints:
    web:
      exposure:
        include: health,info
